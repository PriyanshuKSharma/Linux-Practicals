<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .bg{fill:#07090b}
      .layer{fill:#0c1017;stroke:#1b2430;stroke-width:2}
      .label{fill:#cfeff6;font-family:DM Sans,Arial,monospace;font-weight:600;font-size:18px}
      .sub{fill:#9fbfc9;font-size:13px}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="10"/>
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="720" height="70" rx="8" class="layer"/>
    <text x="20" y="38" class="label">User Space / Applications</text>
    <text x="20" y="58" class="sub">Shells · Daemons · Containers · Libraries · User Apps</text>

    <rect x="0" y="90" width="720" height="38" rx="6" class="layer"/>
    <text x="20" y="114" class="label">System Call Interface</text>

    <rect x="0" y="140" width="720" height="130" rx="8" class="layer"/>
    <text x="20" y="170" class="label">Kernel</text>
    <text x="20" y="190" class="sub">Scheduler · Memory Manager · VFS / Filesystems · Device Drivers · IPC</text>

    <rect x="0" y="290" width="720" height="70" rx="8" class="layer"/>
    <text x="20" y="328" class="label">Hardware</text>
    <text x="20" y="348" class="sub">CPU · RAM · Disks · NICs · Devices</text>
  </g>
</svg>
