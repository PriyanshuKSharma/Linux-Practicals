<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Sandbox | Linux For DevOps Notes</title>
  <meta name="description" content="Interactive browser-based virtual shell terminal simulator. Practice standard Linux command line utilities, write redirects, and solve DevOps shell scripting challenges offline.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Linux Notes home">
      <span class="brand-mark">lx</span>
      <span>Linux DevOps Notes</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="siteNav">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <line x1="1" y1="4" x2="17" y2="4"/>
        <line x1="1" y1="9" x2="17" y2="9"/>
        <line x1="1" y1="14" x2="17" y2="14"/>
      </svg>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
      <a href="index.html">Notes</a>
      <a href="projects.html">Projects</a>
      <a href="cheat-sheet.html">Cheat Sheet</a>
      <a class="active" href="terminal.html">Terminal Sandbox</a>
      <a href="https://www.youtube.com/watch?v=e01GGTKmtpc" target="_blank" rel="noreferrer">Video</a>
      <a href="https://github.com/PriyanshuKSharma/Linux-Practicals" target="_blank" rel="noreferrer">Repo</a>
    </nav>
  </header>

  <main class="terminal-fullscreen-container">
    <!-- The Fullscreen Shell Window -->
    <div class="terminal-window fullscreen-shell">
      <div class="terminal-header">
        <div class="terminal-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="terminal-title">bash - devops@linux-sandbox: ~</div>
        
        <!-- Compact Stats summary direkt in header -->
        <div class="header-stats-panel" id="terminalStats">
          <span>🏆 0 / 5 Cleared</span>
          <span>⚡ 0 Ran</span>
          <span>📁 14 Nodes</span>
        </div>
        
        <div class="terminal-tab">bash</div>
      </div>
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="terminal-input-row">
        <label class="terminal-prompt" id="terminalPrompt" for="terminalInput"></label>
        <input class="terminal-input" id="terminalInput" type="text" autocomplete="off" autofocus spellcheck="false" aria-label="Terminal input line">
        <span class="terminal-caret"></span>
      </div>
    </div>

    <!-- Floating Target Action Button to open Drawer -->
    <button class="drawer-toggle-fab" id="drawerToggle" title="Open Challenges &amp; File System Tree" aria-label="Open sidebar panel">
      🎯
    </button>

    <!-- Translucent Slide-out Drawer Panel -->
    <aside class="slide-drawer" id="slideDrawer" aria-label="Playground control panel">
      <div class="drawer-header">
        <h2 class="drawer-title">Practice Panel</h2>
        <button class="drawer-close-btn" id="drawerClose" aria-label="Close panel">✖</button>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" id="tabChallengesBtn">🎯 Scripting Challenges</button>
        <button class="tab-btn" id="tabVfsBtn">📁 File Tree</button>
      </div>

      <div class="tab-panel active" id="panelChallenges">
        <div class="challenges-list" id="challengesList"></div>
      </div>

      <div class="tab-panel" id="panelVfs">
        <div class="vfs-card">
          <div class="vfs-header">
            <span>Virtual File Tree</span>
            <span class="vfs-muted">Click node to cd / cat</span>
          </div>
          <div class="vfs-list" id="vfsList"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="assets/js/terminal-challenges.js"></script>
  <script src="assets/js/virtual-shell.js"></script>
  <script src="assets/js/nav-toggle.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Handles tab switching between Challenges and VFS Visualizer in the drawer
      const tabChallengesBtn = document.getElementById("tabChallengesBtn");
      const tabVfsBtn = document.getElementById("tabVfsBtn");
      const panelChallenges = document.getElementById("panelChallenges");
      const panelVfs = document.getElementById("panelVfs");

      if (tabChallengesBtn && tabVfsBtn && panelChallenges && panelVfs) {
        tabChallengesBtn.addEventListener("click", () => {
          tabChallengesBtn.classList.add("active");
          tabVfsBtn.classList.remove("active");
          panelChallenges.classList.add("active");
          panelVfs.classList.remove("active");
        });

        tabVfsBtn.addEventListener("click", () => {
          tabVfsBtn.classList.add("active");
          tabChallengesBtn.classList.remove("active");
          panelVfs.classList.add("active");
          panelChallenges.classList.remove("active");
        });
      }

      // Handles drawer sliding open/close
      const drawerToggle = document.getElementById("drawerToggle");
      const drawerClose = document.getElementById("drawerClose");
      const slideDrawer = document.getElementById("slideDrawer");
      const terminalInput = document.getElementById("terminalInput");

      const openDrawer = () => {
        slideDrawer.classList.add("open");
        drawerToggle.style.display = "none";
      };

      const closeDrawer = () => {
        slideDrawer.classList.remove("open");
        drawerToggle.style.display = "flex";
        if (terminalInput) terminalInput.focus();
      };

      if (drawerToggle && drawerClose && slideDrawer) {
        drawerToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          openDrawer();
        });

        drawerClose.addEventListener("click", (e) => {
          e.stopPropagation();
          closeDrawer();
        });

        // Close drawer when clicking outside of it
        document.addEventListener("click", (event) => {
          if (slideDrawer.classList.contains("open") && 
              !slideDrawer.contains(event.target) && 
              event.target !== drawerToggle) {
            closeDrawer();
          }
        });

        // Keyboard shortcuts: Escape closes drawer, Ctrl + M (or Cmd + M) toggles it
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && slideDrawer.classList.contains("open")) {
            closeDrawer();
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "m") {
            e.preventDefault();
            if (slideDrawer.classList.contains("open")) {
              closeDrawer();
            } else {
              openDrawer();
            }
          }
        });
      }
    });
  </script>
</body>
</html>
